name: Docs

# Builds the Sphinx site (API pages come from autodoc over the compiled
# extension, so the Rust module is built first) plus rustdoc for the crate,
# and deploys to GitHub Pages through the Actions deployment. The Pages
# source for the repository must be set to "GitHub Actions"; there is no
# docs branch to maintain.
on:
  push:
    branches: [ prod ]
    paths:
      - "docs/**"
      - "rust/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (Sphinx + rustdoc)
    if: github.repository == 'luksgrin/PyEvoMotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install package and docs dependencies
        run: uv sync --extra docs

      - name: Build Sphinx site
        run: uv run sphinx-build -W --keep-going -b html docs site

      - name: Build rustdoc for the crate
        run: |
          cargo doc --no-deps --document-private-items --manifest-path rust/Cargo.toml
          mkdir -p site/rustdoc
          cp -r rust/target/doc/. site/rustdoc/
          echo '<meta http-equiv="refresh" content="0; url=PyEvoMotion/index.html">' > site/rustdoc/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
