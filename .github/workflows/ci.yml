name: CI

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Cache test data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: tests/data/test3/
          key: test-data-v1

      - name: Skip data prep if cache is hit
        if: steps.cache-data.outputs.cache-hit == 'true'
        run: echo "Test data is cached. Skipping download."

      - name: Download and extract test data (if needed)
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          echo "Test data not found in cache — downloading..."
          uv run python -c "import tests.helpers.test_UK_USA_dataset_helpers as t; t.download_data_zip(); t.extract_data_zip();"

      - name: Run tests with pytest
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -sv
