[project]
name = "PyEvoMotion"
version = "0.2.0"
description = "Evolutionary motion analysis tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Lucas Goiriz", email = "lucas.goiriz@csic.es" },
]
keywords = ["evolution", "anomalous diffusion", "bioinformatics"]
# Runtime: the extension drives pandas (data model, TSV I/O), numpy (array
# interchange) and matplotlib (plots). FASTA I/O, alignment and statistics
# are implemented in Rust.
dependencies = [
    "matplotlib>=3.9.1,<4.0.0",
    "numpy>=1.26,<3.0.0",
    "pandas>=2.2.2,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9.0.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0.2,<9.0.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
    "sphinxcontrib-bibtex>=2.6.3,<3.0.0",
]

[project.scripts]
PyEvoMotion = "PyEvoMotion:_main"

[project.urls]
Homepage = "https://luksgrin.github.io/PyEvoMotion/"
Repository = "https://github.com/luksgrin/PyEvoMotion/"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# The entire package is a single compiled extension module named
# `PyEvoMotion` — there is no Python source. `import PyEvoMotion` loads the
# shared library directly, which defines every public class plus `_main`
# (the CLI entry point). Building from sdist requires a Rust toolchain
# (cargo); pre-built wheels on PyPI carry the native code so end users don't.
[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "rust/Cargo.toml"
module-name = "PyEvoMotion"
strip = true
include = [
    { path = "share/**/*", format = ["sdist", "wheel"] },
    { path = "tests/__init__.py", format = "sdist" },
    { path = "tests/helpers/**/*", format = "sdist" },
    { path = "tests/test_core.py", format = "sdist" },
    { path = "tests/test_parser.py", format = "sdist" },
    { path = "tests/test_synthetic_datasets.py", format = "sdist" },
    { path = "tests/test_UK_USA_dataset.py", format = "sdist" },
    { path = "tests/data/test1/**/*", format = "sdist" },
    { path = "tests/data/test2/**/*", format = "sdist" },
    { path = "tests/data/test3/ids_sampled_for_figure.json", format = "sdist" },
    { path = "tests/data/test3/ids_sampled_for_ci.json", format = "sdist" },
    { path = "tests/data/golden/**/*", format = "sdist" },
    { path = "tests/test_golden_outputs.py", format = "sdist" },
    { path = "rust/Cargo.toml", format = "sdist" },
    { path = "rust/Cargo.lock", format = "sdist" },
    { path = "rust/src/**/*", format = "sdist" },
]
# Files that must NEVER reach a published artifact (manuscript reviewer
# materials, etc.). Releases are built from the `prod` branch where these
# don't exist; this list is defense in depth.
exclude = [
    { path = "**/__pycache__/**", format = ["sdist", "wheel"] },
    { path = "**/*.pyc", format = ["sdist", "wheel"] },
    { path = "rust/.gitignore", format = ["sdist", "wheel"] },
    { path = "share/REVIEWER_SIMULATION_REPORTING.md", format = ["sdist", "wheel"] },
    { path = "share/analyze_test_runs.py", format = ["sdist", "wheel"] },
    { path = "share/figure.eps", format = ["sdist", "wheel"] },
    { path = "share/hyperbolic_tangent.pdf", format = ["sdist", "wheel"] },
    { path = "share/simulation_figure.py", format = ["sdist", "wheel"] },
    { path = "share/simulation_parameter_figure.pdf", format = ["sdist", "wheel"] },
    { path = "share/test5_true_parameters.json", format = ["sdist", "wheel"] },
]
